<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>System Audio Spectroscope</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05060a;
        color: #c7d1ff;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          "Courier New", monospace;
      }
      #hud {
        position: absolute;
        left: 10px;
        top: 10px;
        padding: 10px 12px;
        background: rgba(10, 12, 20, 0.65);
        border: 1px solid rgba(120, 150, 255, 0.25);
        border-radius: 10px;
        backdrop-filter: blur(8px);
        line-height: 1.35;
        user-select: none;
      }
      #hud strong {
        color: #ffffff;
      }
      #hint {
        opacity: 0.85;
        margin-top: 6px;
        font-size: 12px;
      }
      canvas {
        display: block;
      }
      /* World-anchored labels: position set each frame from Vector3.project(camera) */
      #axis-legends {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
      }
      .viz-3d-label {
        position: fixed;
        left: 0;
        top: 0;
        visibility: hidden;
        color: rgba(210, 220, 255, 0.95);
        font-size: 11px;
        line-height: 1.2;
        text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
        white-space: nowrap;
        will-change: left, top;
      }
      .viz-3d-label.viz-3d-title {
        font-weight: 600;
        color: #fff;
        font-size: 12px;
      }
      .viz-3d-label .viz-3d-sub {
        display: block;
        font-weight: 400;
        font-size: 10px;
        opacity: 0.85;
        margin-top: 2px;
      }
      .viz-3d-label[data-align="center"] {
        transform: translate(-50%, -50%);
      }
      .viz-3d-label[data-align="above"] {
        transform: translate(-50%, calc(-100% - 6px));
      }
      .viz-3d-label[data-align="left"] {
        transform: translate(calc(-100% - 8px), -50%);
      }
      .viz-3d-label[data-align="right"] {
        transform: translate(8px, -50%);
      }
      .viz-3d-label[data-align="below"] {
        transform: translate(-50%, 6px);
      }
      .viz-3d-label[data-align="below-left"] {
        transform: translate(calc(-100% - 8px), 6px);
      }
    </style>
    <!-- Local Three.js (served from /vendor/ by music_viz_server.py); no CDN required -->
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud">
      <div><strong>System Audio Spectroscope</strong></div>
      <div id="status">connecting…</div>
      <div id="hint">Drag to orbit · Scroll to zoom · Fixed 60 Hz viz · Smooth scroll 24 rows/s</div>
    </div>

    <div id="axis-legends" data-axis-legend="1" aria-hidden="true"></div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "/vendor/OrbitControls.js";

      const statusEl = document.getElementById("status");

      function main() {
        // #region agent log
        fetch("http://127.0.0.1:7764/ingest/e4740462-32b8-4549-b086-754682f74b57", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Debug-Session-Id": "f98fec" },
          body: JSON.stringify({
            sessionId: "f98fec",
            hypothesisId: "H3",
            location: "web/index.html:main",
            message: "client_main_started",
            data: { host: location.host, protocol: location.protocol },
            timestamp: Date.now(),
          }),
        }).catch(() => {});
        // #endregion
        statusEl.textContent = "loaded (initializing 3D + websocket)…";
        // Scene
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x05060a, 130, 280);

        const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 600);
        camera.position.set(0, 48, 150);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
        renderer.setSize(window.innerWidth, window.innerHeight);
        if ("toneMappingExposure" in renderer) renderer.toneMappingExposure = 1.28;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.target.set(0, 42, 12);

        // Lights — boosted so the spectroscope wall reads clearly
        scene.add(new THREE.AmbientLight(0xe8eeff, 0.58));
        scene.add(new THREE.HemisphereLight(0xc8d8ff, 0x1a2030, 0.48));
        const keyLight = new THREE.DirectionalLight(0xffffff, 1.15);
        keyLight.position.set(30, 70, 110);
        scene.add(keyLight);
        const fillLight = new THREE.DirectionalLight(0xa0b8ff, 0.55);
        fillLight.position.set(-80, 40, 60);
        scene.add(fillLight);

        // Grid
        const grid = new THREE.GridHelper(220, 44, 0x2840aa, 0x16214f);
        grid.position.y = -8;
        scene.add(grid);

        // XY spectroscope wall: X = frequency, Y = time/history, Z = amplitude (depth from wall)
        let nPoints = 0;
        let positions = null;
        let colors = null;
        let geometry = null;
        let mesh = null;
        let legendRefLines = null;
        let legendAnchors = [];
        const _legendProj = new THREE.Vector3();
        const _legendView = new THREE.Vector3();
        const _legendFrustum = new THREE.Frustum();
        const _legendFrustumMat = new THREE.Matrix4();

        // Fixed-rate simulation (decoupled from monitor/WebSocket jitter).
        const SIM_HZ = 60;
        const SIM_DT = 1 / SIM_HZ;
        const SCROLL_ROWS_PER_SEC = 24;
        const MAX_SIM_STEPS_PER_FRAME = 8;
        const MOTION_ATTACK_HZ = 14;
        const MOTION_RELEASE_HZ = 9;
        const SPATIAL_BLUR = 0.2;
        const SPATIAL_PASSES = 2;
        let aLatest = null;
        let aBlurred = null;
        let aBlur2 = null;
        let aDisplay = null;
        let aHistory = null;
        let historyHead = 0;
        let scrollPhase = 0;
        let simAccumulator = 0;
        let _lastAnimT = performance.now();
        let _normalsTick = 0;

        const PLANE_W = 168;
        const PLANE_H = 120;
        const PLANE_NY = 160;
        const FLOOR_Y = -8;
        const HEIGHT = 28;
        /** Wall plane for axis anchors (Z = 0). */
        const WALL_Z = 0;
        const DEPTH_FADE_EXP = 1.35;
        const COLOR_GAIN = 1.38;
        const TIME_BRIGHT_FLOOR = 0.48;

        function hsvToRgb(h, s, v) {
          const i = Math.floor(h * 6) % 6;
          const f = h * 6 - Math.floor(h * 6);
          const p = v * (1 - s);
          const q = v * (1 - f * s);
          const t = v * (1 - (1 - f) * s);
          switch (i) {
            case 0:
              return [v, t, p];
            case 1:
              return [q, v, p];
            case 2:
              return [p, v, t];
            case 3:
              return [p, q, v];
            case 4:
              return [t, p, v];
            default:
              return [v, p, q];
          }
        }

        /** t in [0,1]: low amplitude -> red, high -> purple (color varies along Z) */
        function ampRgb(t) {
          const tt = Math.max(0, Math.min(1, t));
          const h = tt * (280 / 360);
          return hsvToRgb(h, 0.86, 1.0);
        }

        function formatHz(f) {
          if (f < 1000) return f >= 100 ? `${f.toFixed(0)} Hz` : `${f} Hz`;
          const k = f / 1000;
          if (k < 10) {
            const s = k.toFixed(2).replace(/\.?0+$/, "");
            return `${s} kHz`;
          }
          return `${k.toFixed(1)} kHz`;
        }

        function updateLegendScreenPositions() {
          if (!legendAnchors.length) return;
          const reversed = !!camera.reversedDepth;
          _legendFrustumMat.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
          _legendFrustum.setFromProjectionMatrix(_legendFrustumMat, THREE.WebGLCoordinateSystem, reversed);
          const r = renderer.domElement.getBoundingClientRect();
          for (let i = 0; i < legendAnchors.length; i++) {
            const { el, world } = legendAnchors[i];
            if (!_legendFrustum.containsPoint(world)) {
              el.style.visibility = "hidden";
              continue;
            }
            _legendView.copy(world).applyMatrix4(camera.matrixWorldInverse);
            if (_legendView.z >= -1e-4) {
              el.style.visibility = "hidden";
              continue;
            }
            _legendProj.copy(world).project(camera);
            if (Math.abs(_legendProj.x) > 1.12 || Math.abs(_legendProj.y) > 1.12) {
              el.style.visibility = "hidden";
              continue;
            }
            el.style.visibility = "visible";
            const px = r.left + (_legendProj.x * 0.5 + 0.5) * r.width;
            const py = r.top + (-_legendProj.y * 0.5 + 0.5) * r.height;
            el.style.left = `${px}px`;
            el.style.top = `${py}px`;
          }
        }

        /**
         * Axis legends glued to the spectroscope edges (reprojected each frame):
         * X = frequency (bottom), Y = time/history (left), Z = amplitude depth (bottom-left corner).
         */
        function buildAxisLegends(fMin, fMax) {
          const root = document.getElementById("axis-legends");
          if (!root) return { freq: 0, amp: 0 };

          if (legendRefLines) {
            scene.remove(legendRefLines.freq);
            scene.remove(legendRefLines.amp);
            if (legendRefLines.time) scene.remove(legendRefLines.time);
            legendRefLines.freq.geometry.dispose();
            legendRefLines.amp.geometry.dispose();
            if (legendRefLines.time) legendRefLines.time.geometry.dispose();
            legendRefLines.mat.dispose();
            legendRefLines = null;
          }

          root.innerHTML = "";
          legendAnchors = [];

          const x0 = -PLANE_W * 0.5;
          const x1 = PLANE_W * 0.5;
          const y0 = FLOOR_Y;
          const y1 = FLOOR_Y + PLANE_H;
          const z0 = WALL_Z;
          const z1 = WALL_Z + HEIGHT;
          const zLbl = WALL_Z + 1.5;

          const pushLabel = (html, wx, wy, wz, className, dataAlign) => {
            const el = document.createElement("div");
            el.className = `viz-3d-label ${className}`.trim();
            el.innerHTML = html;
            if (dataAlign) el.dataset.align = dataAlign;
            root.appendChild(el);
            legendAnchors.push({ el, world: new THREE.Vector3(wx, wy, wz) });
          };

          // —— X axis: frequency (along bottom of wall) ——
          pushLabel(
            `Frequency (Hz)<span class="viz-3d-sub">left = bass · right = treble</span>`,
            0,
            y0 - 5,
            zLbl,
            "viz-3d-title",
            "above"
          );

          const lf0 = Math.log(fMin);
          const lf1 = Math.log(fMax);
          const cand = [40, 100, 250, 630, 1600, 4000, 10000, 16000];
          let nFreq = 0;
          for (const f of cand) {
            if (f < fMin * 0.99 || f > fMax * 1.01) continue;
            const t = (Math.log(Math.max(f, fMin * 1.0001)) - lf0) / (lf1 - lf0);
            const x = x0 + t * PLANE_W;
            pushLabel(formatHz(f), x, y0 + 1.5, zLbl, "", "below");
            nFreq++;
          }

          // —— Y axis: time / memory (along left edge of wall) ——
          pushLabel(
            `Time (history)<span class="viz-3d-sub">up = newest · down = older</span>`,
            x0 - 10,
            y0 + PLANE_H * 0.5,
            zLbl,
            "viz-3d-title",
            "left"
          );
          pushLabel("Newer", x0 - 2, y1 - 3, zLbl, "", "left");
          pushLabel("Older", x0 - 2, y0 + 3, zLbl, "", "left");

          // —— Z axis: amplitude depth (bottom-left corner, outward from wall) ——
          const zGuideY = y0 + 10;
          pushLabel(
            `Loudness (Z depth)<span class="viz-3d-sub">color: red = quiet · purple = loud</span>`,
            x0 - 10,
            zGuideY,
            (z0 + z1) * 0.5,
            "viz-3d-title",
            "left"
          );

          const amps = [0, 0.25, 0.5, 0.75, 1.0];
          for (const a of amps) {
            const tag =
              a === 0 ? "0.00 · quiet" : a === 1 ? "1.00 · loud" : a.toFixed(2);
            pushLabel(tag, x0 + 3, zGuideY, z0 + HEIGHT * a, "", "right");
          }

          const lineMat = new THREE.LineBasicMaterial({
            color: 0x6a8cff,
            transparent: true,
            opacity: 0.5,
          });
          const geoFreq = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(x0, y0 + 0.5, zLbl),
            new THREE.Vector3(x1, y0 + 0.5, zLbl),
          ]);
          const geoTime = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(x0 + 0.5, y0 + 2, zLbl),
            new THREE.Vector3(x0 + 0.5, y1 - 2, zLbl),
          ]);
          const geoAmp = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(x0 + 1, zGuideY, z0),
            new THREE.Vector3(x0 + 1, zGuideY, z1),
          ]);
          const lineFreq = new THREE.Line(geoFreq, lineMat);
          const lineTime = new THREE.Line(geoTime, lineMat);
          const lineAmp = new THREE.Line(geoAmp, lineMat);
          scene.add(lineFreq, lineTime, lineAmp);
          legendRefLines = { freq: lineFreq, amp: lineAmp, time: lineTime, mat: lineMat };

          return { freq: nFreq, amp: amps.length };
        }

        function allocPlaneMesh(n) {
          if (mesh) {
            scene.remove(mesh);
            geometry?.dispose();
            mesh.material?.dispose();
            mesh = null;
            geometry = null;
          }
          nPoints = n;
          aLatest = new Float32Array(nPoints);
          aBlurred = new Float32Array(nPoints);
          aBlur2 = new Float32Array(nPoints);
          aDisplay = new Float32Array(nPoints);
          aHistory = new Float32Array(nPoints * PLANE_NY);
          historyHead = 0;
          scrollPhase = 0;
          simAccumulator = 0;
          _normalsTick = 0;
          const nx = n;
          const ny = PLANE_NY;
          const nVert = nx * ny;
          positions = new Float32Array(nVert * 3);
          colors = new Float32Array(nVert * 3);
          const ix = [];
          const denom = Math.max(1, nx - 1);
          const denomY = Math.max(1, ny - 1);

          for (let j = 0; j < ny; j++) {
            const timeT = j / denomY;
            const timeBright =
              TIME_BRIGHT_FLOOR + (1 - TIME_BRIGHT_FLOOR) * Math.pow(timeT, DEPTH_FADE_EXP);
            for (let i = 0; i < nx; i++) {
              const vi = j * nx + i;
              const [r, g, b] = ampRgb(0);
              const gain = COLOR_GAIN * timeBright;
              colors[vi * 3 + 0] = Math.min(1, r * gain);
              colors[vi * 3 + 1] = Math.min(1, g * gain);
              colors[vi * 3 + 2] = Math.min(1, b * gain);
              const x = (i / denom) * PLANE_W - PLANE_W * 0.5;
              const y = FLOOR_Y + timeT * PLANE_H;
              positions[vi * 3 + 0] = x;
              positions[vi * 3 + 1] = y;
              positions[vi * 3 + 2] = WALL_Z;
            }
          }
          for (let j = 0; j < ny - 1; j++) {
            for (let i = 0; i < nx - 1; i++) {
              const a0 = j * nx + i;
              const b0 = j * nx + i + 1;
              const c0 = (j + 1) * nx + i;
              const d0 = (j + 1) * nx + i + 1;
              ix.push(a0, c0, b0, b0, c0, d0);
            }
          }

          geometry = new THREE.BufferGeometry();
          geometry.setIndex(ix);
          geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
          geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
          geometry.computeVertexNormals();

          const material = new THREE.MeshStandardMaterial({
            vertexColors: true,
            metalness: 0.03,
            roughness: 0.38,
            emissive: 0x182040,
            emissiveIntensity: 0.55,
            side: THREE.DoubleSide,
            fog: false,
          });
          mesh = new THREE.Mesh(geometry, material);
          scene.add(mesh);
        }

        function updateFrame(a) {
          if (!aLatest || a.length !== nPoints) return;
          for (let i = 0; i < nPoints; i++) aLatest[i] = Math.max(0, Math.min(1, a[i]));
        }

        function modRow(rowF) {
          const ny = PLANE_NY;
          return ((rowF % ny) + ny) % ny;
        }

        function sampleRing(rowF, i) {
          const nx = nPoints;
          const ny = PLANE_NY;
          const w = modRow(rowF);
          const j0 = Math.floor(w);
          const f = w - j0;
          const j1 = (j0 + 1) % ny;
          const a0 = aHistory[j0 * nx + i];
          const a1 = aHistory[j1 * nx + i];
          return a0 + (a1 - a0) * f;
        }

        function writeHeadRow() {
          if (!aHistory || !aDisplay) return;
          const nx = nPoints;
          const row = historyHead * nx;
          for (let i = 0; i < nx; i++) aHistory[row + i] = aDisplay[i];
        }

        /** Fixed scroll speed along Y (rows per second), independent of WebSocket timing. */
        function advanceScroll(dtSec) {
          scrollPhase += dtSec * SCROLL_ROWS_PER_SEC;
          if (scrollPhase >= 1) {
            scrollPhase -= 1;
            historyHead = (historyHead + 1) % PLANE_NY;
            writeHeadRow();
          }
        }

        /** One fixed simulation tick: smooth spectrum, scroll, update geometry. */
        function simTick(dtSec) {
          if (!aLatest || !aBlurred || !aDisplay || !aHistory || nPoints <= 0) return;

          _applySpatialBlur(aLatest, aBlurred);
          let tgt = aBlurred;
          if (SPATIAL_PASSES >= 2) {
            _applySpatialBlur(aBlurred, aBlur2);
            tgt = aBlur2;
          }
          for (let i = 0; i < nPoints; i++) {
            const err = tgt[i] - aDisplay[i];
            const rate = err > 0 ? MOTION_ATTACK_HZ : MOTION_RELEASE_HZ;
            const alpha = 1 - Math.exp(-rate * dtSec);
            aDisplay[i] += err * alpha;
          }

          writeHeadRow();
          advanceScroll(dtSec);
          updateMeshFromHistory();
          _normalsTick++;
        }

        function updateMeshFromHistory() {
          if (!positions || !geometry || !aHistory || nPoints <= 0) return;
          const nx = nPoints;
          const ny = PLANE_NY;
          const denomY = Math.max(1, ny - 1);
          for (let j = 0; j < ny; j++) {
            const timeT = j / denomY;
            const timeBright =
              TIME_BRIGHT_FLOOR + (1 - TIME_BRIGHT_FLOOR) * Math.pow(timeT, DEPTH_FADE_EXP);
            const age = ny - 1 - j + scrollPhase;
            const rowF = historyHead - age;
            const row = j * nx;
            for (let i = 0; i < nx; i++) {
              const vi = row + i;
              const amp = sampleRing(rowF, i);
              const o = vi * 3;
              positions[o + 2] = WALL_Z + HEIGHT * amp;
              const [r, g, b] = ampRgb(amp);
              const gain = COLOR_GAIN * timeBright;
              colors[o + 0] = Math.min(1, r * gain);
              colors[o + 1] = Math.min(1, g * gain);
              colors[o + 2] = Math.min(1, b * gain);
            }
          }
          geometry.attributes.position.needsUpdate = true;
          geometry.attributes.color.needsUpdate = true;
        }

        function _applySpatialBlur(src, dst) {
          // 1D blur: dst = (1-b)*src + b*avg(neighbors)
          const b = SPATIAL_BLUR;
          if (b <= 0) {
            dst.set(src);
            return;
          }
          const inv = 1 - b;
          const n = src.length;
          dst[0] = inv * src[0] + b * (0.5 * (src[0] + src[1]));
          for (let i = 1; i < n - 1; i++) {
            dst[i] = inv * src[i] + b * (0.5 * (src[i - 1] + src[i + 1]));
          }
          dst[n - 1] = inv * src[n - 1] + b * (0.5 * (src[n - 2] + src[n - 1]));
        }

        // WebSocket (must use http:// from music_viz_server — not file://)
        if (!location.host) {
          statusEl.textContent =
            "Open this page from the app link (http://127.0.0.1:8766/), not as a saved file.";
          return;
        }
        const wsProto = location.protocol === "https:" ? "wss" : "ws";
        const primaryWsUrl = `${wsProto}://${location.host}/ws`;
        const altWsUrl = `${wsProto}://localhost:${location.port}/ws`;
        const hangTimer = window.setTimeout(() => {
          statusEl.textContent =
            "Still connecting… If you have a proxy/VPN/extension that blocks localhost WebSockets, try a different browser or disable the proxy for localhost.";
        }, 8000);

        function connectWs(url, label) {
          statusEl.textContent = `connecting (${label})…`;
          const ws = new WebSocket(url);
          ws.onopen = () => {
            window.clearTimeout(hangTimer);
            statusEl.textContent = `connected (${label}) (waiting for audio)…`;
          };
          ws.onclose = () => {
            statusEl.textContent = `disconnected (${label})`;
          };
          ws.onerror = () => {
            // try fallback once
            if (label === "127.0.0.1" && altWsUrl !== url) {
              ws.close();
              connectWs(altWsUrl, "localhost");
              return;
            }
            window.clearTimeout(hangTimer);
            statusEl.textContent =
              `websocket error (${label}) — something is blocking ws:// to localhost. Try disabling proxy/VPN or use another browser.`;
          };
          return ws;
        }

        const ws = connectWs(primaryWsUrl, "127.0.0.1");
        let hudBase = "";
        ws.onmessage = (ev) => {
          let msg;
          try {
            msg = JSON.parse(ev.data);
          } catch (e) {
            console.warn("non-json ws message", ev.data);
            return;
          }
          if (msg.type === "hello") {
            allocPlaneMesh(msg.n_points);
            const legendCounts = buildAxisLegends(msg.f_min, msg.f_max);
            // #region agent log
            fetch("http://127.0.0.1:7764/ingest/e4740462-32b8-4549-b086-754682f74b57", {
              method: "POST",
              headers: { "Content-Type": "application/json", "X-Debug-Session-Id": "f98fec" },
              body: JSON.stringify({
                sessionId: "f98fec",
                hypothesisId: "H1",
                location: "web/index.html:ws_onmessage",
                message: "hello_axis_legends_ready",
                runId: "post-fix",
                data: {
                  n_points: msg.n_points,
                  f_min: msg.f_min,
                  f_max: msg.f_max,
                  freq_tick_count: legendCounts.freq,
                  amp_tick_count: legendCounts.amp,
                  axis_legends_root_present: !!document.getElementById("axis-legends"),
                },
                timestamp: Date.now(),
              }),
            }).catch(() => {});
            // #endregion
            const dev = msg.device ? `\n${msg.device}` : "";
            hudBase = `streaming · points=${msg.n_points} · sr=${msg.sample_rate}${dev}`;
            statusEl.textContent = hudBase;
          } else if (msg.type === "frame") {
            updateFrame(msg.a);
            if (typeof msg.peak === "number") {
              statusEl.textContent = `${hudBase}\npeak≈${msg.peak.toFixed(5)} (time-domain)`;
            }
          }
        };

        // Render loop: rAF draws the screen; simulation advances at a fixed SIM_Hz.
        function animate() {
          requestAnimationFrame(animate);
          const nowT = performance.now();
          const frameDt = Math.min(0.1, Math.max(0, (nowT - _lastAnimT) / 1000));
          _lastAnimT = nowT;
          controls.update();
          updateLegendScreenPositions();

          if (positions && geometry && aHistory && nPoints > 0) {
            simAccumulator += frameDt;
            let steps = 0;
            while (simAccumulator >= SIM_DT && steps < MAX_SIM_STEPS_PER_FRAME) {
              simTick(SIM_DT);
              simAccumulator -= SIM_DT;
              steps++;
            }
            if (_normalsTick > 0 && geometry) {
              geometry.computeVertexNormals();
              _normalsTick = 0;
            }
          }

          renderer.render(scene, camera);
        }
        animate();

        window.addEventListener("resize", () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });
      }

      main();
    </script>
  </body>
</html>
